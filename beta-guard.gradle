// Packaging must go through build-version.ps1 so both loaders use the assigned version.
gradle.taskGraph.whenReady { graph ->
    def packaged = graph.allTasks.any { task ->
        task.project == project && task.name in ['jar', 'sourcesJar', 'remapJar', 'remapSourcesJar', 'reobfJar']
    }
    if (packaged && project.findProperty('hivemindBetaAssigned') != project.version.toString()) {
        throw new GradleException('Usa build-version.ps1 -Version para asignar la versión antes de generar JAR.')
    }
}
