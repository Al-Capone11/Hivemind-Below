plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

apply from: '../../beta-guard.gradle'

group = project.mod_group_id
version = project.mod_version
base.archivesName = 'hivemind-neoforge'

sourceSets.main.java.srcDir('../../Core/src/main/java')

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        neoForgeVersion = project.neo_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        hivemind { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.properties(version: project.version, minecraft_version: project.minecraft_version, neo_version: project.neo_version)
    filesMatching('META-INF/mods.toml') { expand project.properties }
}
