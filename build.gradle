tasks.register('buildVersion', Exec) {
    group = 'build'
    description = 'Build both loaders for this Minecraft version.'
    workingDir projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('build-version.ps1'), '-Version', providers.gradleProperty('hivemindVersion').getOrElse('0.1.0')
}
