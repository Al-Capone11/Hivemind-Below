tasks.register('buildVersion', Exec) {
    group = 'build'
    description = 'Build both loaders for this Minecraft version.'
    workingDir projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('build-version.ps1'), '-Version', providers.gradleProperty('hivemindVersion').getOrElse('0.1.0')
}

tasks.register('buildAll', Exec) {
    group = 'build'
    description = 'Build all eight variants from the local worktrees.'
    workingDir projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', file('build-all.ps1')
    if (providers.gradleProperty('release').isPresent()) {
        args '-Release'
    }
}
